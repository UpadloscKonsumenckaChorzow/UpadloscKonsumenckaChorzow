# Ustawienia pnpm. Od pnpm 11 pole "pnpm" w package.json nie jest czytane,
# więc nadpisania wersji muszą być tutaj (w package.json zostają dla
# starszych wersji pnpm).

# Jeden pakiet (sam projekt). Pole wymagane przez pnpm 9, którego używa
# budowanie w Cloudflare – bez niego instalacja kończy się błędem
# "packages field missing or empty".
packages:
  - "."

# Wymuszona wersja hono (zależność wranglera) – poprawka bezpieczeństwa.
overrides:
  hono: 4.12.25

# Pakiety, które mogą uruchamiać skrypty instalacyjne (binarki).
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
